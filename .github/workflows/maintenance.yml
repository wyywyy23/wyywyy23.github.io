name: Maintenance Automation

on:
  workflow_dispatch:
    inputs:
      run_image_resize:
        description: Run responsive image generation under assets/img
        required: false
        default: true
        type: boolean
      run_submodule_update:
        description: Update Font Awesome and Academicons submodules
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "0 11 * * 1"

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install image tooling dependency
        run: python -m pip install --upgrade pip pillow

      - name: Run image resize automation
        if: ${{ github.event_name == 'schedule' || inputs.run_image_resize }}
        run: make resize-images

      - name: Run submodule update automation
        if: ${{ github.event_name == 'schedule' || inputs.run_submodule_update }}
        run: make update-submodules

      - name: Create maintenance pull request
        id: create_pull_request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: automate image variants and icon submodule refresh"
          title: "chore: maintenance refresh (images and icon submodules)"
          body: |
            Automated maintenance updates:
            - Regenerated responsive image variants under assets/img as needed.
            - Updated icon submodules to latest release tags.
          branch: chore/maintenance-refresh
          delete-branch: true

      - name: Merge maintenance pull request
        if: ${{ steps.create_pull_request.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.create_pull_request.outputs.pull-request-number }}" \
            --repo "${{ github.repository }}" \
            --squash \
            --delete-branch \
            --match-head-commit "${{ steps.create_pull_request.outputs.pull-request-head-sha }}"

      - name: Deploy site after maintenance merge
        if: ${{ steps.create_pull_request.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run jekyll.yml --repo "${{ github.repository }}" --ref master
