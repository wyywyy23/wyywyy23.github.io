# Personal site settings. Theme behavior overrides are kept explicit.
---
url: https://wangyy.phd
baseurl: ''
lang: en
title: Yuyang Wang
description: >
  Yuyang Wang is an Assistant Professor at UConn.
tagline: " Photonics Researcher <br> Engineering Educator <br> Husband & Father of Two"
logo: "/assets/img/avatar/yuyang_wang@480w.jpg"

author:
  name: Yuyang Wang
  email: me@wangyy.phd

menu:
- title: Publications
  url: "/publications/"
- title: Teaching
  url: "/docs/teaching/"
- title: News
  url: "/blog/"

copyright: Yuyang Wang. All rights reserved.
legal:
- title: Privacy
  url: /privacy/

permalink: "/blog/:categories/:year-:month-:day-:title/"

theme: jekyll-theme-hydejack
accent_image: rgb(0, 0, 0)
accent_color: rgb(208, 135, 112)
theme_color: rgb(0, 0, 0)

google_fonts: Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900|JetBrains+Mono:ital,wght@0,100..800;1,100..800|Noto+Sans:ital,wght@0,100..900;1,100..900
font_heading: Fira Sans, Helvetica, Arial, sans-serif
font_code: JetBrains Mono, Menlo, Monaco, Consolas, monospace;
favicon: "/assets/icons/favicon.ico"
apple_touch_icon: "/assets/icons/apple-touch-icon.png"

defaults:
- scope:
    path: assets/
  values:
    sitemap: false
- scope:
    path: licenses/
  values:
    layout: plain
    sitemap: false
- scope:
    type: projects
  values:
    seo:
      type: WebPage
- scope:
    type: featured_categories
  values:
    seo:
      type: WebPage
- scope:
    type: featured_tags
  values:
    seo:
      type: WebPage

kramdown:
  math_engine: katex
  math_engine_opts: {}
  footnote_backlink: "&#x21a9;&#xfe0e;"

hydejack:
  post_addons:
  - about
  - related
  project_addons:
  - about
  - other
  no_mark_external: false
  no_push_state: false
  no_drawer: false
  no_navbar: false
  no_search: false
  no_inline_css: false
  no_page_style: false
  no_break_layout: true
  no_toc: false
  no_third_column: false
  no_large_headings: false
  no_structured_data: false
  no_theme_color: false
  no_breadcrumbs: false
  use_lsi: false
  cookies_banner: true
  advertise: false
  hide_dates: false
  hide_last_modified: false
  dark_mode:
    always: false
    dynamic: true
    icon: true
  offline:
    enabled: false

collections:
  featured_categories:
    permalink: "/blog/:name/"
    output: true
  featured_tags:
    permalink: "/tag-:name/"
    output: true
  projects:
    permalink: "/projects/:path/"
    output: true

exclude:
- ".jekyll-cache"
- ".sass-cache"
- ".ruby-lsp"
- ".wrangler"
- "*.toml"
- vendor
- Gemfile
- Gemfile.lock
- functions
include:
- LICENSE.md

plugins:
- jekyll-default-layout
- jekyll-feed
- jekyll-optional-front-matter
- jekyll-readme-index
- jekyll-redirect-from
- jekyll-relative-links
- jekyll-seo-tag
- jekyll-sitemap
- jekyll-titles-from-headings
- jekyll-include-cache
- jekyll-last-modified-at

optional_front_matter:
  remove_originals: true

readme_index:
  remove_originals: true
  with_frontmatter: true

relative_links:
  collections: true

titles_from_headings:
  strip_title: true
  collections: true

compress_html:
  comments:
  - "<!--"
  - "-->"
  clippings: all
  endings: all
  ignore:
    envs:
    - development

sass:
  style: compressed

jekyll_compose:
  default_front_matter:
    drafts:
      layout: post
    posts:
      layout: post
    projects:
      layout: project
